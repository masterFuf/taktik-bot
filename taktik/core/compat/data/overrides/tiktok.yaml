# TikTok Selector Overrides — Version-specific diffs
#
# This file contains ONLY selectors that DIFFER from the current Python
# dataclass selectors in taktik/core/social_media/tiktok/ui/selectors/.
#
# The Python selectors are the source of truth for the current target version.
# When a new TikTok version changes a selector, add an entry here.
#
# Format:
#   versions:
#     "<version_string>":
#       "<domain>.<action>":
#         - "//*[@resource-id='new_id']"
#         - "//fallback/xpath"

meta:
  app: tiktok
  package: com.zhiliaoapp.musically
  baseline_version: "43.1.4"
  last_updated: "2026-09-29"

versions:
  # Add version-specific overrides here as new app versions are discovered.
  # Only include selectors that CHANGED — unchanged selectors inherit from Python.
  "46.6.3":
    # Search results page: the pager under the tab strip now has a readable id, the same on
    # 46.6.3, 46.9.3 and 47.0.3 (19 results pages out of 19, 0 other screens). Baseline entry
    # carried along.
    search.results_page:
      - '//*[contains(@resource-id, ":id/viewpager_search")]'
      - '//*[contains(@resource-id, ":id/zpl")]'
    # Upload progress badge (Pixel 6a, an upload in flight): the percent label is now
    # `tvProgress`, in the floating badge near the top left; the baseline `x44` is absent. Seen on
    # 46.6.3 (English, "66%") and on 47.0.3 (French, "99%", same id). Baseline entry carried along.
    publish_progress._publish_progress_rids:
      - '//*[contains(@resource-id, ":id/tvProgress")]'
      - '//*[contains(@resource-id, ":id/x44")]'
  "46.9.3":
    # LIVE preview in the For You feed (Pixel 6a, 2 captures): readable ids, no author. Baseline
    # entries carried along (absent from every 46.x and 47.0.3 dump of the Lab and the corpus).
    video_state.live_preview:
      - '//*[contains(@resource-id, ":id/tv_live_nickname")]'
      - '//*[contains(@resource-id, ":id/tv_live_tips")]'
      - '//*[contains(@resource-id, ":id/xro")]'
      - '//*[contains(@resource-id, ":id/xs4")]'
    # DM send arrow: an ImageView with no content-desc, shown only once the composer holds text
    # (text differs from the hint). It follows the stickers Button in the composer's action row;
    # with an empty composer the same slot holds the "+" Button and no ImageView.
    conversation._send_button_base:
      - '//*[contains(@resource-id, ":id/jt8")]'
      - '//android.widget.Button[@content-desc="Send"]'
      - '//android.widget.EditText[string-length(@text)>0][not(@text=@hint)]/../following-sibling::*[1]/*[last()][preceding-sibling::*[1]/android.widget.Button[@clickable="true"]]/android.widget.ImageView[@clickable="true"]'
  "47.0.3":
    # « Voir les Stories » card of a followed account, served by the For You feed in place of a
    # video (Pixel 6a, French, 2026-09-29, the Lab auto-test): the button `d3j`, in the card `duq`.
    # Both answer on the two dumps of that card and on none of the 628 other 47.0.3 dumps of the
    # Lab and the capture corpus, nor on any 43.1.4, 46.6.3 or 46.9.3 dump. Baseline entries (`cei`,
    # `cej`, the same card on 43.1.4) carried along: absent from every 46.x and 47.0.3 dump.
    video_state.stories_card:
      - '//*[contains(@resource-id, ":id/d3j")]'
      - '//*[contains(@resource-id, ":id/duq")]'
      - '//*[contains(@resource-id, ":id/cei")]'
      - '//*[contains(@resource-id, ":id/cej")]'
    # The Activity page (Pixel 6a, French, 2026-09-29, the page `tt.activity.open` opened in the Lab
    # auto-test and did not recognise): no « Filtres » control any more, the filter is the arrow of
    # its « Activité » tab `y5n`, beside a « Nouveaux followers » tab `y6f` on the same page. The tab
    # shown carries the underline: `y5o` under « Activité », `y6g` under « Nouveaux followers ». The
    # « Activité » tab with its underline answers on the 4 dumps of that tab and on none of the other
    # 626 47.0.3 dumps (the 3 of the « Nouveaux followers » tab among them), nor on any other
    # version. Baseline entry `pzx` carried along (absent from every 47.0.3 dump); the baseline
    # « Filtres » / « Filters » is NOT: on 47.0.3 it is a button of the video editor (the 6 dumps
    # where it answers), which it would take for this page.
    activity.page_indicator:
      - '//*[contains(@resource-id, ":id/y5n")][.//*[contains(@resource-id, ":id/y5o")]]'
      - '//*[contains(@resource-id, ":id/pzx")]'
    # Profile stats row (Pixel 6a, two profiles: a followed media account and an account that
    # follows us): values `t8_`, labels `t89`, three of each, in the same order (following,
    # followers, likes). The baseline ids `qfw` / `qfv` resolve nothing on 47.0.3, so the row
    # was read only through the locale text anchors. Baseline entries carried along.
    profile._stat_value_base:
      - '//*[contains(@resource-id, ":id/t8_")]'
      - '//*[contains(@resource-id, ":id/qfw")]'
    profile._stat_label_base:
      - '//*[contains(@resource-id, ":id/t89")]'
      - '//*[contains(@resource-id, ":id/qfv")]'
    # Back arrow (Pixel 6a, French, 2026-09-28, a run of target profiles): on the player of a
    # video opened from a profile's grid, the arrow is the clickable ImageView `bs4` at the top
    # left; none of the baseline entries resolves there. In the 47.0.3 captures, `bs4` is the back
    # arrow of every screen that has one, and the close cross of the comment sheet. Baseline
    # entries carried along.
    followers.back_button:
      - '//*[contains(@resource-id, ":id/bs4")]'
      - '//*[contains(@resource-id, ":id/b9b")]'
      - '//*[contains(@resource-id, ":id/bqo")]'
      - '//*[contains(@resource-id, ":id/b9c")]'
      - '//android.widget.ImageView[contains(@resource-id, ":id/b9b")]'
      - '//*[@clickable="true"][starts-with(@content-desc, "Suivis ")]/ancestor::android.widget.HorizontalScrollView[1]/preceding-sibling::*[1]//android.widget.ImageView[@clickable="true"][not(@content-desc) or @content-desc=""]'
    # Publication of a video (Pixel 6a, French, 2026-09-27: the camera, the gallery, the editor and
    # the post screen of one publication, piloted by hand node by node). Baseline entries carried
    # along in each list.
    # Camera: the way into the gallery is the clickable `upload_hot_area` at the bottom left. None
    # of the baseline ids (`ymg`, `ce9`, `cl2`) and neither locale label is on the screen, and
    # the production run of that day found nothing and tapped the effects carousel instead.
    publish_media_picker._upload_btn_base:
      - '//*[contains(@resource-id, ":id/upload_hot_area") and @clickable="true"]'
      - '//*[contains(@resource-id, ":id/ymg") and @clickable="true"]'
      - '//*[contains(@resource-id, ":id/ce9") and @clickable="true"]'
      - '//*[contains(@resource-id, ":id/cl2") and @clickable="true"]'
      - '//*[contains(@resource-id, ":id/ymg")]'
      - '//*[contains(@resource-id, ":id/ce9")]'
      - '//*[contains(@resource-id, ":id/cl2")]'
    # Gallery: the grid is `jmm`, a cell holds the thumbnail `owc` and the selection box `l34`.
    # Ticking the box of the first cell selects the newest medium (the box reads "1", the gallery's
    # Next reads "Suivant (1)"), the gesture proven on the phone; the same xpath tells the gallery
    # open. The baseline taps the thumbnail `mub` of 43.1.4, which opens a preview there.
    # Only xpaths here: the plain markers of the catalogue (`_gallery_picker_xml_markers`,
    # `_post_screen_xml_markers_base`) are fallbacks this flow never reaches on 47.0.3, and an
    # override entry must be a selector the snapshot-equality proof can check.
    publish_media_picker._gallery_first_item_rids:
      - '(//*[contains(@resource-id, ":id/l34")])[1]'
      - '(//android.widget.ImageView[contains(@resource-id, ":id/mub")])[1]'
      - '(//android.widget.GridView[contains(@resource-id, ":id/i8o")]//android.widget.ImageView)[1]'
      - '(//android.widget.ImageView[contains(@resource-id, ":id/nm8")])[1]'
      - '(//android.widget.GridView[contains(@resource-id, ":id/ir_")]//android.widget.ImageView)[1]'
      - '//*[contains(@resource-id, ":id/ir_")]//android.widget.ImageView[1]'
    # Next: the gallery's "Suivant (1)" is the Button `xyk`, the editor's "Suivant" the clickable
    # `q03`. "Ta Story" (`tq4`, a quick publication to the story) sits beside `q03` and is never
    # named here.
    publish_media_picker._next_btn_base:
      - '//*[contains(@resource-id, ":id/xyk")]'
      - '//*[contains(@resource-id, ":id/q03")]'
      - '//*[contains(@resource-id, ":id/uyb")]'
      - '//*[contains(@resource-id, ":id/ooo")]'
      - '//*[contains(@resource-id, ":id/w51")]'
      - '//*[contains(@resource-id, ":id/next_btn")]'
    # Editor: TikTok attaches a sound to the imported video on its own. The label of the sound chip
    # is `tv_top_text` (the title of that sound, or "Ajouter un son" once there is none); the cross
    # that takes the sound off is the clickable `e1d`, whose description is an unresolved resource
    # number. Tapped, the chip reads "Ajouter un son" and `e1d` is gone. No baseline entry.
    publish_editor._sound_chip_base:
      - '//*[contains(@resource-id, ":id/tv_top_text")]'
    publish_editor._sound_remove_btn_base:
      - '//*[contains(@resource-id, ":id/e1d") and @clickable="true"]'
    # Post screen: the description is the EditText `h8e`, "Publier" the Button `tiq` ("Brouillons"
    # `ght` beside it). The baseline `g19` and `qrb` are absent; only the French locale found them.
    publish_composer._caption_input_base:
      - '//*[contains(@resource-id, ":id/h8e")]'
      - '//*[contains(@resource-id, ":id/g19")]'
      - '//android.widget.EditText[@clickable="true"][1]'
      - '(//android.widget.EditText)[1]'
    publish_composer._post_btn_base:
      - '//*[contains(@resource-id, ":id/tiq")]'
      - '//*[contains(@resource-id, ":id/qrb")]'
      - '//*[contains(@resource-id, ":id/post_btn")]'
