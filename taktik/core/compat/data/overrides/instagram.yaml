# Instagram Selector Overrides — Version-specific diffs
#
# This file contains ONLY selectors that DIFFER from the current Python
# dataclass selectors in taktik/core/social_media/instagram/ui/selectors/.
#
# The Python selectors are the source of truth for the baseline version (v410).
# When a new Instagram version changes a selector, add an entry here.
#
# Format:
#   versions:
#     "<version_string>":
#       "<domain>.<field_name>":
#         - "//*[@resource-id='new_id']"
#         - "//fallback/xpath"
#
# For fields that are plain str (not List[str]) in the dataclass,
# only the FIRST xpath in the list is used.
#
# The patch system applies all versions <= detected version, sorted ascending,
# so newer versions can override older ones (last-write-wins).

meta:
  app: instagram
  package: com.instagram.android
  baseline_version: "410.0.0.53.71"
  last_updated: "2026-08-25"

versions:

  # ─── Instagram v442.x ───────────────────────────────────────────────
  # Verified against a live v442.0.0.46.79 device dump (2026-08-25).
  #
  # v442 rebuilt the DM inbox rows in Jetpack Compose: the rows carry NO
  # resource-ids at all any more (row_inbox_container / row_inbox_username /
  # row_inbox_digest are gone). What survives is the accessibility layer:
  # each row exposes one android.view.View whose content-desc is the same
  # digest the old container carried ("username, [unread,] preview, time"),
  # with a full-row android.widget.Button as its following sibling.
  #
  # The selector below anchors on the thread-list recyclerview (still
  # present), requires a comma in the content-desc (folder tabs like
  # "All, 3 unread" also have commas but no Button sibling; the search row
  # has a Button sibling but no comma) and was validated 7/7 rows with zero
  # false positives on the live dump.
  "442.0.0.0":

    dm.thread_container:
      - '//*[@resource-id="com.instagram.android:id/inbox_refreshable_thread_list_recyclerview"]//android.view.View[contains(@content-desc, ",")][following-sibling::android.widget.Button]'

  # ─── Instagram v417.x ───────────────────────────────────────────────
  # Based on compat-report v417.0.0.54.77 (2026-03-06)
  # Score: 27.3% — 18/66 found, 48 never found
  #
  # RULE: Only override fields where the PRIMARY selector is broken or
  #       where reordering priorities significantly improves hit rate.
  #       Do NOT override lists where at least one entry already works.
  "417.0.0.0":

    # ── Comment field (str) ───────────────────────────────────────────
    # v417 changed: resource-id → layout_comment_thread_edittext_multiline
    #               hint → "Join the conversation…"
    #               class → AutoCompleteTextView (not EditText)
    post.comment_field_selector:
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext_multiline"]'
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext"]'
      - '//*[contains(@resource-id, "comment_thread_edittext")]'
      - '//*[contains(@hint, "Join the conversation")]'
      - '//*[contains(@hint, "Rejoindre la conversation")]'
      - '//*[contains(@hint, "Add a comment")]'
      - '//*[contains(@hint, "Ajouter un commentaire")]'

    # Patch the *_base field, NEVER the property: `comment_field_selectors` is
    # `_comment_field_selectors_base + L(...)`, so the property is read-only and an override
    # aimed at it was silently skipped -- measured on a 442 device, 0 of the 13 baseline
    # selectors found the comment field. The pre-417 entries are kept as a tail because IG
    # serves layouts per account.
    text_input._comment_field_selectors_base:
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext_multiline"]'
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext"]'
      - '//*[contains(@resource-id, "comment_thread_edittext")]'
      - '//*[contains(@hint, "Join the conversation")]'
      - '//*[contains(@hint, "Rejoindre la conversation")]'
      - '//*[contains(@hint, "Add a comment")]'
      - '//*[contains(@hint, "Ajouter un commentaire")]'
      - '//*[contains(@resource-id, "comment_edittext")]'
      - '//android.widget.AutoCompleteTextView[contains(@resource-id, "comment")]'
      - '//*[@resource-id="com.instagram.android:id/comment_box_text"]'
      - '//*[@resource-id="com.instagram.android:id/inline_compose_box"]'
      - '//*[contains(@resource-id, "comment_box")]'
      - '//*[contains(@hint, "Aggiungi un commento")]'
      - '//*[contains(@hint, "Añade un comentario")]'
      - '//android.widget.EditText[contains(@resource-id, "comment")]'
      - '//android.widget.EditText[@focused="true"]'
      - '//android.widget.EditText[@clickable="true"]'
      - '//android.widget.EditText'

    # Same reason as above: `comment_input` is `_comment_input_base + L(...)`.
    feed._comment_input_base:
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext_multiline"]'
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext"]'
      - '//*[contains(@resource-id, "comment_thread_edittext")]'
      - '//*[contains(@text, "Join the conversation")]'
      - '//*[contains(@text, "Add a comment")]'
      - '//*[contains(@text, "Ajouter un commentaire")]'
      - '//android.widget.AutoCompleteTextView[contains(@resource-id, "comment")]'
      - '//android.widget.EditText[contains(@resource-id, "comment")]'
      - '//android.widget.EditText'

    # ── Comments view indicators (for _is_comments_view_open detection) ──
    # v417: new edittext resource-id + new hint "Join the conversation".
    # Same reason as above: `comments_view_indicators` is `_base + L(...)`.
    popup._comments_view_indicators_base:
      - '//*[@text="Comments"]'
      - '//*[@text="Commentaires"]'
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext_multiline"]'
      - '//*[@resource-id="com.instagram.android:id/layout_comment_thread_edittext"]'
      - '//*[contains(@hint, "Join the conversation")]'
      - '//*[contains(@hint, "Rejoindre la conversation")]'
      - '//*[contains(@text, "What do you think")]'
      - '//*[contains(@text, "Add a comment")]'
      - '//*[contains(@text, "Ajouter un commentaire")]'
      - '//*[contains(@hint, "Add a comment")]'
      - '//*[contains(@hint, "What do you think")]'
      - '//*[@resource-id="com.instagram.android:id/row_comment_textview_comment"]'

    # ── Reel counters — nothing to override here ───────────────────
    # `detection.reel_like_count_selector` and `_comment_count_selector` are `str` fields, so a
    # YAML list gives them only its FIRST entry -- and that entry was `like_count` /
    # `comment_count`, which is exactly what the baseline already says. The override was a
    # no-op that read like a repair, and the compat log counted it as applied. Removed rather
    # than reordered: the fallbacks it listed are not equivalent. The button-based one returns
    # the like BUTTON, whose text on 442 is the word "J’aime", not a number, and the
    # content-desc one is English-only.
    #
    # The real reading lives in the extractor: on 442 the media label carries BOTH counts in
    # one string ("Reel de X, 96 J’aime, 9 commentaires"), which is also what makes the read
    # atomic. See `extract_post_stats_atomic` and journal IG-UI-025.

    # ── Reel indicators — nothing to override here ──
    # `post.reel_indicators` and `detection.reel_indicators` are properties returning the
    # LOCALE overlay alone (the clips_* ids were dropped from the baseline on 2026-03-07,
    # 0/30 on v417). "Reel by" / "Reel de" already live in locales/en.py and locales/fr.py,
    # which is their right home -- they are language, not version. The overrides that used to
    # sit here duplicated them and were skipped as read-only properties.

    # ── Followers list — view_pager/mutual/followers removed from baseline 2026-03-07 ──
    # tab_layout 15/30 (only working indicator). Others all 0 found.
    detection.followers_list_indicators:
      - '//*[@resource-id="com.instagram.android:id/unified_follow_list_tab_layout"]'

    followers_list.list_indicators:
      - '//*[@resource-id="com.instagram.android:id/unified_follow_list_tab_layout"]'

    # ── Profile username — action_bar_large_title 0/2, action_bar_title 2/2 ──
    # Reorder so working selector is first.
    profile.username:
      - '//*[@resource-id="com.instagram.android:id/action_bar_title"]'
      - '//*[contains(@resource-id, "action_bar_title")]'
      - '//*[@resource-id="com.instagram.android:id/action_bar_large_title_auto_size"]'
      - '//*[contains(@resource-id, "action_bar_large_title_auto_size")]'
      - '//*[contains(@resource-id, "row_profile_header_username")]'
      - '//android.widget.TextView[contains(@text, "@")]'
