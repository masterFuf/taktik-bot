# TikTok Selector Overrides — Version-specific diffs
#
# This file contains ONLY selectors that DIFFER from the current Python
# dataclass selectors in taktik/core/social_media/tiktok/ui/selectors/.
#
# The Python selectors are the source of truth for the current target version.
# When a new TikTok version changes a selector, add an entry here.
#
# Format:
#   versions:
#     "<version_string>":
#       "<domain>.<action>":
#         - "//*[@resource-id='new_id']"
#         - "//fallback/xpath"

meta:
  app: tiktok
  package: com.zhiliaoapp.musically
  baseline_version: "43.1.4"
  last_updated: "2026-03-05"

versions:
  # Add version-specific overrides here as new app versions are discovered.
  # Only include selectors that CHANGED — unchanged selectors inherit from Python.
  "46.9.3":
    # LIVE preview in the For You feed (Pixel 6a, 2 captures): readable ids, no author.
    video_state.live_preview:
      - '//*[contains(@resource-id, ":id/tv_live_nickname")]'
      - '//*[contains(@resource-id, ":id/tv_live_tips")]'
    # DM send arrow: an ImageView with no content-desc, shown only once the composer holds text
    # (text differs from the hint). It follows the stickers Button in the composer's action row;
    # with an empty composer the same slot holds the "+" Button and no ImageView.
    conversation._send_button_base:
      - '//*[contains(@resource-id, ":id/jt8")]'
      - '//android.widget.Button[@content-desc="Send"]'
      - '//android.widget.EditText[string-length(@text)>0][not(@text=@hint)]/../following-sibling::*[1]/*[last()][preceding-sibling::*[1]/android.widget.Button[@clickable="true"]]/android.widget.ImageView[@clickable="true"]'
  "47.0.3":
    # Profile stats row (Pixel 6a, two profiles: a followed media account and an account that
    # follows us): values `t8_`, labels `t89`, three of each, in the same order (following,
    # followers, likes). The baseline ids `qfw` / `qfv` resolve nothing on 47.0.3, so the row
    # was read only through the locale text anchors. Baseline entries carried along.
    profile._stat_value_base:
      - '//*[contains(@resource-id, ":id/t8_")]'
      - '//*[contains(@resource-id, ":id/qfw")]'
    profile._stat_label_base:
      - '//*[contains(@resource-id, ":id/t89")]'
      - '//*[contains(@resource-id, ":id/qfv")]'
