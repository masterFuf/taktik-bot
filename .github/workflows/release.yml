name: Release source archives

# Release notes are written by hand and published with `gh release create`.
# This workflow only attaches checksummed source archives to a release that already exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release, for example v1.9.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  source-archives:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check the tag and its release
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a version tag (vX.Y.Z)"
            exit 1
          fi
          if ! gh release view "$TAG" > /dev/null; then
            echo "::error::No release for $TAG: create it with gh release create first"
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build the source archives and their checksums
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          git archive --format=zip --prefix="taktik-bot-$VERSION/" HEAD -o "dist/taktik-bot-$VERSION-source.zip"
          git archive --format=tar.gz --prefix="taktik-bot-$VERSION/" HEAD -o "dist/taktik-bot-$VERSION-source.tar.gz"
          cd dist
          sha256sum "taktik-bot-$VERSION-source.zip" > "taktik-bot-$VERSION-source.zip.sha256"
          sha256sum "taktik-bot-$VERSION-source.tar.gz" > "taktik-bot-$VERSION-source.tar.gz.sha256"

      - name: Attach them to the release
        run: gh release upload "$TAG" dist/* --clobber
